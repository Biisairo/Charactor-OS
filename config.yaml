# Character OS 설정
character_dir: characters/hong-gil-dong

# 저장 경로
#
# 생략하면 characters/<id>/state/ 아래로 파생한다 (캐릭터마다 분리).
# 아래 키를 명시하면 그 경로를 그대로 쓰며, 이 경우 모든 캐릭터가
# 같은 저장소를 공유한다 — 2026-08-12 이전의 동작이다.
#   memory_db_path: memory/memories.db
#   emotion_save_path: memory/emotions.json
#   history_save_path: memory/history.json
#   working_memory_path: memory/working_memory.json

# 모델 설정
# model_type: "api" (OpenAI API) 또는 "local" (mlx-lm 로컬)
model_type: api

# 로컬 모델 설정 (model_type: local일 때)
# local_model: mlx-community/Qwen3.5-4B-MLX-4bit
# adapter_path: from_scratch/06_finetuning/adapters

# ---------------------------------------------------------------------------
# 프롬프트 예산과 토큰 계측 (SPEC-11)
#
# 예산은 시스템 프롬프트에만 적용된다. 고정 섹션(페르소나·배경지식·행동지침·
# 내면·감정·응답규칙)이 먼저 차지하고, 남은 몫을 검색 결과가 나눠 갖는다.
# 고정 섹션은 자르지 않는다 — 예산이 모자라면 경고할 뿐이다.
#
# tokenizer 를 비우면 보정 휴리스틱(오차 약 1%)으로 센다. 모델과 같은 계열의
# 토크나이저를 지정하면 정확해진다 — mimo-v2.5 는 Qwen2 계열(vocab 151,643)이라
# 아래 값으로 실측 오차 0.6% 다. 내려받지 못하면 휴리스틱으로 떨어지며,
# 그 사실은 턴 기록의 prompt_budget.method 에 남는다.
#
# 모델을 바꾸면 둘 다 다시 봐야 한다. 휴리스틱 재보정은 SPEC-11 REQ-11-13 참조.
# ---------------------------------------------------------------------------
prompt:
  max_tokens: 3000
  tokenizer: "Qwen/Qwen2.5-7B-Instruct"

# ---------------------------------------------------------------------------
# 임베딩 (SPEC-12)
#
# Memory·Knowledge·FewShot 이 공유하는 단일 신호다. 세 모듈이 같은 좌표계를
# 써야 하므로 모델을 여기 한 곳에서 정한다.
#
# 모델을 바꾸면 두 가지가 자동으로 일어난다.
#   - 지식·예시 임베딩 캐시(state/embeddings.db)가 전량 미스가 된다
#   - 기억(state/memories.db)의 벡터가 저장된 원문으로 다시 계산된다
# 좌표계가 다른 벡터를 섞으면 오류 없이 무의미한 점수가 나오기 때문이다.
#
# 바꾼 뒤에는 `eval/embedding_probe.py` 를 다시 돌려야 한다. Knowledge 의
# NO_KEYWORD_GATE(0.85)가 현재 모델의 유사도 분포에 매여 있다 (SPEC-12 4.2).
#
# query_prefix·passage_prefix 는 모델이 요구하는 규약이다. e5 계열은 이를
# 권하지만, 이 자산에서는 붙이지 않은 쪽이 top-1 이 6%p 높았다 (SPEC-12 4.1).
# 프리픽스를 요구하는 모델로 바꿀 때만 채운다.
# ---------------------------------------------------------------------------
embedding:
  model: "intfloat/multilingual-e5-small"
  query_prefix: ""
  passage_prefix: ""
  normalize: true

# ---------------------------------------------------------------------------
# LLM 호출 운영 로그
#
# 모든 LLM 호출(응답 생성·Reflection·감정·기억)을 JSONL로 누적한다.
# 디버그 플래그와 무관하게 항상 켜지며, 쓰기는 별도 스레드에서 처리하므로
# 응답 지연에 더해지지 않는다.
#
# 분석 예:
#   턴당 비용 합계   jq -s '[.[]|select(.event=="turn").cost_usd]|add' logs/llm_calls.jsonl
#   실패한 호출      jq 'select(.error != "")' logs/llm_calls.jsonl
#   특정 턴 재구성   jq 'select(.turn_id=="<id>")' logs/llm_calls.jsonl
# ---------------------------------------------------------------------------
call_log:
  enabled: true
  path: logs/llm_calls.jsonl
  # 프롬프트·응답 원문을 함께 남길지. 끄면 토큰·비용만 남는다.
  capture_payload: true
  # 파일당 크기와 보관 개수 (50MB × 10 = 최대 500MB, 약 12,000턴)
  max_bytes: 52428800
  backup_count: 10
  # 한 필드가 이 길이를 넘으면 자른다 (잘린 사실은 로그에 표시됨)
  max_field_chars: 20000
