[project]
name = "character-os"
version = "0.1.0"
description = "Character OS - 살아있는 캐릭터 통합 시스템"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    # 토큰 계측용 (SPEC-11). sentence-transformers 로 이미 들어오지만,
    # 직접 쓰므로 전이 의존성에 기대지 않는다.
    "transformers>=4.40.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.53",
    "google-genai>=2.17.0",
    "mcp>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff 설정
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import 정렬)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (포매터가 처리)
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
