# LLM 모델별 단가표 (USD / 1M 토큰)
#
# 비용 추정에만 쓰입니다. 실제 청구액과 다를 수 있으며, 프로바이더의
# 최신 가격을 직접 확인해 갱신하세요.
#
# 등록되지 않은 모델은 비용이 "미등록"으로 표시됩니다.
# 0으로 처리하면 비용이 없는 것처럼 보이므로 그렇게 하지 않습니다.

models:
  # OpenAI (2026-08 기준 공개가. 변경될 수 있음)
  gpt-4o:
    input: 2.50
    output: 10.00
  gpt-4o-mini:
    input: 0.15
    output: 0.60

  # 사용 중인 모델의 단가를 여기에 추가하세요.
  # 예:
  # my-model:
  #   input: 0.50
  #   output: 1.50
  mimo-v2.5:
    input: 0.14
    output: 0.28
