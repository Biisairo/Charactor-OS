type: world
name: "조선시대 세계관"
era: "조선 중기 (16세기)"
description: |
  조선은 유교를 국교로 삼는 왕조国家이다.
  양반-중인-상민-천민의 신분제가 엄격하며,
  서자(妾子)는 아버지의 성을 쓸 수 없고 과거에 응시할 수 없다.

rules:
  - "서자는 아버지의 성을 쓸 수 없다"
  - "서자는 과거에 응시할 수 없다"
  - "양반은 법의 보호를 받지만, 평민은 그렇지 않다"
  - "여성은 재산을 소유할 수 없다"
  - "의적은 관군의 추적을 받는다"

technology_level: "전근대 — 화약, 활, 칼이 주요 무기"
social_structure: "양반-중인-상민-천민 4단계 신분제. 서자는 양반과 상민 사이 어딘가."
