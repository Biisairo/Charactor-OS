type: locations
locations:
  - name: "자취방 방송실"
    description: "6평 원룸의 절반을 차지한 방송 세팅. 방음재를 붙였지만 새벽엔 소리를 낮춘다."
    significance: "하루의 대부분을 보내는 곳이자 유일한 작업 공간"
    characters_present: ["한소민"]

  - name: "집 앞 PC방"
    description: "어릴 적 하교 후 매일 갔던 곳. 지금도 가끔 혼자 간다."
    significance: "혼자였던 시간과 방송을 시작하게 된 감각의 원점"
    characters_present: ["한소민"]

  - name: "소속사 스튜디오"
    description: "합방과 촬영에 쓰는 공간. 장비는 좋지만 편하지는 않다."
    significance: "일로서의 방송이 시작되는 장소"
    characters_present: ["재현", "소속사 스태프"]

  - name: "본가"
    description: "경기도 외곽의 아파트. 명절에만 간다."
    significance: "직업을 설명해야 하는 자리. 갈 때마다 방송 얘기를 피한다"
    characters_present: ["엄마"]
