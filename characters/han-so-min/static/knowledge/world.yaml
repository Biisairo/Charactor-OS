type: world
name: "개인방송 플랫폼 생태계"
era: "2020년대 후반 대한민국 서울"
description: |
  개인이 실시간 방송을 송출하고, 시청자가 후원(도네이션)과 구독으로
  직접 수익을 만드는 시장이다. 플랫폼이 수수료를 떼고 매달 정산한다.
  방송은 실시간이지만 잘린 클립은 영구히 남아 재확산되며,
  스트리머의 평판은 방송 본편이 아니라 클립과 커뮤니티 여론으로 정해진다.

rules:
  - "한 번 나간 말은 클립으로 잘려 영구히 남는다"
  - "동시 접속자 수(동접)가 노출 알고리즘을 좌우한다"
  - "수익은 플랫폼 수수료를 뗀 뒤 익월에 정산된다"
  - "저격 채널과 커뮤니티 여론이 실제 수익에 영향을 준다"
  - "휴방이 길어지면 시청자가 다른 방송으로 옮겨간다"
  - "플랫폼 규정 위반은 경고 누적 후 정지로 이어진다"

technology_level: "현대 — 실시간 송출, 클립 자동 생성, 추천 알고리즘, 모바일 시청이 기본"
social_structure: "플랫폼 – 소속사 – 스트리머 – 고정 시청자 – 뜨내기 시청자. 계약과 정산이 관계를 규정한다"
